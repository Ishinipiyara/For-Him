<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fernhollow — Regenerative Design Studio</title>
<meta name="description" content="A regenerative design studio. Wander through a night valley of flowers that grows as you move.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --u: min(calc(100vw / 1600), calc(100vh / 900));
    --cream: #f5efe2;
    --cream-dim: rgba(245, 239, 226, 0.65);
    --dark: #070908;
    --pill-text: #151510;
    --gold-glow: #d4af37;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    background: #030404;
    overflow: hidden;
    color: var(--cream);
    font-family: 'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* Fullscreen 3D Canvas */
  #valley {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  /* Cinematic Vignette & Subtle Film Grain Overlay */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(circle at center, transparent 42%, rgba(2, 4, 3, 0.85) 100%);
    transition: opacity 0.6s ease;
  }

  /* Custom Luxury Cursor Ring */
  .cursor-ring {
    position: fixed;
    top: 0;
    left: 0;
    width: 36px;
    height: 36px;
    border: 1px solid rgba(245, 239, 226, 0.4);
    border-radius: 50%;
    pointer-events: none;
    z-index: 99;
    transform: translate(-50%, -50%);
    transition: width 0.3s ease, height 0.3s ease, background 0.3s ease, border-color 0.3s ease;
    mix-blend-mode: difference;
  }
  .cursor-ring.active {
    width: 68px;
    height: 68px;
    background: rgba(245, 239, 226, 0.12);
    border-color: var(--cream);
  }

  /* Loader Screen */
  #loader {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: #030404;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    transition: opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1), visibility 1.1s;
  }
  #loader.gone {
    opacity: 0;
    visibility: hidden;
  }
  .pulse-dot {
    width: calc(10 * var(--u));
    height: calc(10 * var(--u));
    min-width: 9px;
    min-height: 9px;
    border-radius: 50%;
    background: var(--cream);
    animation: pulse 1.6s infinite ease-in-out;
  }
  .loader-label {
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    opacity: 0.55;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(0.8); opacity: 0.35; }
    50% { transform: scale(1.4); opacity: 1; }
  }

  /* Main Interface Layer */
  .ui {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .ui.on { opacity: 1; }
  .ui a, .ui button { pointer-events: auto; }

  /* Header */
  header {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(28 * var(--u)) calc(48 * var(--u)) 0;
  }

  .logo {
    font-size: calc(26 * var(--u));
    font-weight: 500;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-mark {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--cream);
    box-shadow: 0 0 12px var(--cream);
  }

  nav {
    display: flex;
    align-items: center;
    gap: calc(44 * var(--u));
    font-size: calc(14 * var(--u));
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  nav button.nav-link {
    position: relative;
    padding: 4px 0;
    transition: opacity 0.25s;
  }
  nav button.nav-link::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 1px;
    background: var(--cream);
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  nav button.nav-link:hover::after {
    transform: scaleX(1);
    transform-origin: left;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    height: calc(46 * var(--u));
    padding: 0 calc(28 * var(--u));
    border-radius: 99px;
    background: var(--cream);
    color: var(--pill-text);
    font-weight: 500;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
  }
  .pill:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(245, 239, 226, 0.25);
  }

  /* Center Hero */
  .hero {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-46%);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 20px;
  }

  .reveal-mask {
    overflow: hidden;
    padding-bottom: 6px;
  }

  h1 {
    font: 400 calc(158 * var(--u))/0.92 'Antonio', 'Arial Narrow', sans-serif;
    letter-spacing: -0.012em;
    white-space: nowrap;
    transform: translateY(105%);
    transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s;
  }
  .ui.on h1 {
    transform: translateY(0);
  }

  .cap {
    margin-top: calc(44 * var(--u));
    font-size: calc(20 * var(--u));
    line-height: 1.38;
    color: var(--cream-dim);
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 1s ease 0.55s, transform 1s cubic-bezier(0.16, 1, 0.3, 1) 0.55s;
  }
  .ui.on .cap {
    opacity: 1;
    transform: translateY(0);
  }

  /* Round Action Button */
  .cta-wrap {
    margin-top: calc(36 * var(--u));
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 1s ease 0.75s, transform 1s cubic-bezier(0.16, 1, 0.3, 1) 0.75s;
  }
  .ui.on .cta-wrap {
    opacity: 1;
    transform: scale(1);
  }

  #go {
    width: calc(62 * var(--u));
    height: calc(62 * var(--u));
    min-width: 52px;
    min-height: 52px;
    border-radius: 50%;
    border: 1.5px solid var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.35s ease, color 0.35s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease;
  }
  #go svg {
    width: calc(20 * var(--u));
    height: calc(20 * var(--u));
    min-width: 18px;
    min-height: 18px;
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #go:hover {
    background: var(--cream);
    color: var(--pill-text);
    transform: scale(1.08);
    box-shadow: 0 0 30px rgba(245, 239, 226, 0.35);
  }
  #go:hover svg {
    transform: translateX(3px);
  }

  /* Bottom Bar */
  .bottom-left {
    position: absolute;
    left: calc(48 * var(--u));
    bottom: calc(44 * var(--u));
    font-size: calc(12 * var(--u));
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0.5;
  }

  .bottom-right {
    position: absolute;
    right: calc(48 * var(--u));
    bottom: calc(44 * var(--u));
    display: flex;
    align-items: center;
    gap: calc(20 * var(--u));
  }

  .scroll-hint {
    font-size: calc(12.5 * var(--u));
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0.8;
  }

  .divider {
    width: 1px;
    height: calc(26 * var(--u));
    min-height: 20px;
    background: rgba(245, 239, 226, 0.25);
  }

  #sound {
    width: calc(32 * var(--u));
    height: calc(32 * var(--u));
    min-width: 28px;
    min-height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.85;
    transition: opacity 0.2s, transform 0.2s;
  }
  #sound:hover {
    opacity: 1;
    transform: scale(1.1);
  }

  /* Luxury Slide-Over Studio Drawer */
  .drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(3, 5, 4, 0.65);
    backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .drawer-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(540px, 100vw);
    z-index: 40;
    background: rgba(11, 15, 13, 0.94);
    border-left: 1px solid rgba(245, 239, 226, 0.14);
    padding: 48px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transform: translateX(100%);
    transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: auto;
  }
  .drawer.open {
    transform: translateX(0);
  }

  .drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(245, 239, 226, 0.12);
    padding-bottom: 20px;
  }
  .drawer-tag {
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.6;
  }
  .close-btn {
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 6px 14px;
    border: 1px solid rgba(245, 239, 226, 0.25);
    border-radius: 99px;
    transition: background 0.25s, color 0.25s;
  }
  .close-btn:hover {
    background: var(--cream);
    color: var(--pill-text);
  }

  .drawer-body h2 {
    font: 400 54px/0.98 'Antonio', sans-serif;
    margin-bottom: 20px;
  }
  .drawer-body p {
    font-size: 16px;
    line-height: 1.65;
    color: var(--cream-dim);
    margin-bottom: 24px;
  }
  .project-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 12px;
  }
  .project-item {
    padding: 16px 0;
    border-top: 1px solid rgba(245, 239, 226, 0.12);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
