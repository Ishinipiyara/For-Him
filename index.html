<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Structural Integrity & Wife Support Control Center</title>
<style>
  :root {
    --blueprint-bg: #0a192f;
    --blueprint-grid: rgba(100, 255, 218, 0.08);
    --safety-yellow: #ffb703;
    --alert-red: #e63946;
    --coffee-brown: #4a2c2a;
    --text-light: #e6f1ff;
    --cyan-accent: #64ffda;
  }

  * { box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }

  body {
    margin: 0;
    background-color: var(--blueprint-bg);
    background-image: 
      linear-gradient(var(--blueprint-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--blueprint-grid) 1px, transparent 1px);
    background-size: 25px 25px;
    color: var(--text-light);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .hazard-bar {
    height: 14px;
    background: repeating-linear-gradient(
      -45deg,
      var(--safety-yellow),
      var(--safety-yellow) 15px,
      #111 15px,
      #111 30px
    );
  }

  .container {
    max-width: 750px;
    margin: 0 auto;
    padding: 20px;
    position: relative;
    z-index: 2;
  }

  header {
    border: 2px solid var(--cyan-accent);
    background: rgba(10, 25, 47, 0.9);
    padding: 15px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 0 15px rgba(100, 255, 218, 0.2);
  }

  header h1 {
    margin: 0;
    font-size: 1.4rem;
    color: var(--safety-yellow);
    text-transform: uppercase;
  }

  .status-badge {
    display: inline-block;
    background: var(--alert-red);
    color: white;
    padding: 4px 10px;
    font-weight: bold;
    font-size: 0.85rem;
    margin-top: 8px;
    animation: blink 1.2s infinite;
  }

  @keyframes blink { 50% { opacity: 0.4; } }

  /* Gauges */
  .gauges {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 25px;
  }

  .gauge-card {
    border: 1px solid var(--cyan-accent);
    background: rgba(17, 34, 64, 0.85);
    padding: 10px;
    text-align: center;
  }

  .gauge-val {
    font-size: 1.2rem;
    font-weight: bold;
    color: var(--safety-yellow);
    margin-top: 5px;
  }

  /* SOS Buttons */
  .sos-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
  }

  .sos-btn {
    border: 2px solid;
    padding: 18px;
    text-align: left;
    cursor: pointer;
    background: rgba(17, 34, 64, 0.95);
    color: white;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
  }

  .sos-btn:hover { transform: translateY(-2px); }

  .btn-red { border-color: var(--alert-red); box-shadow: 0 0 10px rgba(230, 57, 70, 0.3); }
  .btn-yellow { border-color: var(--safety-yellow); box-shadow: 0 0 10px rgba(255, 183, 3, 0.3); }
  .btn-cyan { border-color: var(--cyan-accent); box-shadow: 0 0 10px rgba(100, 255, 218, 0.2); }

  .sos-tag {
    font-size: 0.75rem;
    font-weight: bold;
    padding: 2px 6px;
    display: inline-block;
    margin-bottom: 6px;
  }
  .tag-red { background: var(--alert-red); }
  .tag-yellow { background: var(--safety-yellow); color: #111; }
  .tag-cyan { background: var(--cyan-accent); color: #111; }

  .sos-title { font-size: 1.1rem; font-weight: bold; margin: 4px 0; }
  .sos-desc { font-size: 0.85rem; opacity: 0.85; margin: 0; }

  /* Interactive Modal / Display Panel */
  .panel {
    display: none;
    margin-top: 25px;
    border: 2px solid var(--safety-yellow);
    background: #112240;
    padding: 20px;
    text-align: center;
  }

  /* Photo Slideshow */
  .photo-frame {
    border: 3px dashed var(--cyan-accent);
    padding: 10px;
    margin: 15px auto;
    max-width: 420px;
    background: #0a192f;
  }

  .photo-frame img {
    width: 100%;
    height: 280px;
    object-fit: cover;
    display: block;
  }

  .photo-caption {
    margin-top: 10px;
    font-size: 0.9rem;
    color: var(--safety-yellow);
  }

  .nav-btns {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 12px;
  }

  .action-btn {
    background: var(--cyan-accent);
    color: #0a192f;
    border: none;
    padding: 10px 16px;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.9rem;
    text-decoration: none;
    display: inline-block;
    margin-top: 10px;
  }

  .whatsapp-btn {
    background: #25D366;
    color: #fff;
  }

  /* Coffee Blast Animation Elements */
  .coffee-particle {
    position: fixed;
    font-size: 2.5rem;
    z-index: 9999;
    pointer-events: none;
    user-select: none;
  }

  #coffee-wave {
    position: fixed;
    bottom: -100%;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(74, 44, 42, 0.85);
    z-index: 9998;
    transition: bottom 1.2s ease-in-out;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #fff;
    text-align: center;
    padding: 20px;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="hazard-bar"></div>

<div class="container">
  <header>
    <h1>🏗️ Structural Integrity & Wife Support Control</h1>
    <div class="status-badge">ALERT: HIGH MSc EXAM LOAD DETECTED</div>
  </header>

  <div class="gauges">
    <div class="gauge-card">
      <div>BRAIN STRESS</div>
      <div class="gauge-val">9,850 kN</div>
    </div>
    <div class="gauge-card">
      <div>DISTANCE GAP</div>
      <div class="gauge-val">TOO FAR</div>
    </div>
    <div class="gauge-card">
      <div>WIFE DEFICIT</div>
      <div class="gauge-val">CRITICAL</div>
    </div>
  </div>

  <div class="sos-grid">
    <!-- Option 1: Missing Wife + Photo Vault -->
    <button class="sos-btn btn-red" onclick="openMissingWife()">
      <span class="sos-tag tag-red">CODE RED // PRIORITY 1</span>
      <div class="sos-title">💔 Structural Failure: Missing Wife</div>
      <p class="sos-desc">Foundation unstable due to living apart. Unlock visual reinforcement memories immediately.</p>
    </button>

    <!-- Option 2: Coffee Blast Animation -->
    <button class="sos-btn btn-yellow" onclick="triggerCoffeeBlast()">
      <span class="sos-tag tag-yellow">HAZARD LEVEL 5</span>
      <div class="sos-title">☕ Low Concrete & Caffeine Slump</div>
      <p class="sos-desc">Energy dropping below safety code. Initiate emergency high-pressure caffeine blast!</p>
    </button>

    <!-- Option 3: Exam Stress Relief -->
    <button class="sos-btn btn-cyan" onclick="openExamBoost()">
      <span class="sos-tag tag-cyan">SYSTEM OVERLOAD</span>
      <div class="sos-title">📐 MSc Formula & Textbook Overload</div>
      <p class="sos-desc">Mental load exceeds design capacity. Request structural inspection & wife encouragement.</p>
    </button>
  </div>

  <!-- Dynamic Output Panel -->
  <div id="output-panel" class="panel"></div>
</div>

<!-- Full Screen Coffee Wave Overlay -->
<div id="coffee-wave">
  <h1 style="font-size: 2rem; color: #ffb703;">☕ CAFFEINE INJECTION COMPLETE! ☕</h1>
  <p style="font-size: 1.1rem; max-width: 500px;">500mg of virtual espresso delivered straight to your brain. You've got this, Engineer!</p>
</div>

<div class="hazard-bar" style="position: fixed; bottom: 0; width: 100%;"></div>

<script>
  // ==========================================
  // 1. CUSTOMIZE YOUR PHOTOS & CAPTIONS HERE
  // ==========================================
  // Put your 4-5 image files in the same folder as this HTML file
  // and replace the filenames below (e.g., "photo1.jpg").
  const ourMemories = [
    {
      src: "photo1.jpg", 
      caption: "Inspection #01: Load-bearing smile that keeps me going every day ❤️"
    },
    {
      src: "photo2.jpg",
      caption: "Inspection #02: Counting down the days until we're under the same roof again!"
    },
    {
      src: "photo3.jpg",
      caption: "Inspection #03: My favorite Civil Engineer — smartest & strongest man I know 🏗️"
    },
    {
      src: "photo4.jpg",
      caption: "Inspection #04: Post-exam date night pending... keep pushing, my love!"
    },
    {
      src: "photo5.jpg",
      caption: "Inspection #05: No matter the distance, I'm always right beside you 💕"
    }
  ];

  // Optional: Add your WhatsApp number with country code (e.g., "94771234567") or leave blank ""
  const wifeWhatsAppNumber = ""; 

  let currentPhotoIndex = 0;

  function getWhatsAppLink(message) {
    const encoded = encodeURIComponent(message);
    return wifeWhatsAppNumber 
      ? `https://wa.me{wifeWhatsAppNumber}?text=${encoded}`
      : `https://wa.me{encoded}`;
  }

  // ==========================================
  // OPTION 1: MISSING WIFE SLIDESHOW
  // ==========================================
  function openMissingWife() {
    currentPhotoIndex = 0;
    renderPhotoVault();
  }

  function renderPhotoVault() {
    const panel = document.getElementById("output-panel");
    const memory = ourMemories[currentPhotoIndex];
    const waLink = getWhatsAppLink("🚨 SITE ALERT #ENG-LOVE: Structural failure detected because I miss my wife! Requesting an emergency call/voice note right now ❤️");

    panel.style.display = "block";
    panel.innerHTML = `
      <h2 style="color: var(--alert-red); margin-top: 0;">🔓 STRUCTURAL MEMORY VAULT UNLOCKED</h2>
      <p>Memory ${currentPhotoIndex + 1} of ${ourMemories.length}</p>
      <div class="photo-frame">
        <img src="${memory.src}" alt="Us Together" onerror="this.src='https://placeholder.com+(${memory.src})'">
        <div class="photo-caption">${memory.caption}</div>
      </div>
      <div class="nav-btns">
        <button class="action-btn" onclick="changePhoto(-1)">⬅️ Prev</button>
        <button class="action-btn" onclick="changePhoto(1)">Next ➡️</button>
      </div>
      <br>
      <a href="${waLink}" target="_blank" class="action-btn whatsapp-btn">📲 Send "I Miss You" Alert on WhatsApp</a>
    `;
    panel.scrollIntoView({ behavior: "smooth" });
  }

  function changePhoto(step) {
